[project]
name = "labctl"
version = "0.1.0"
description = "Temporary OCI lab environments: invite users to a compartment, then wipe it clean."
requires-python = ">=3.11"
dependencies = [
    "oci>=2.126.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
labctl = "labctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labctl"]
